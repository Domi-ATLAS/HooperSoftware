spring.main.allow-circular-references=true

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ✅ BASE DE DATOS H2 (CORREGIDA)
spring.datasource.url=jdbc:h2:file:./data/demodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ✅ CONSOLA H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ✅ JPA / HIBERNATE
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
#desarrollo
spring.jpa.hibernate.ddl-auto=create
#cuando no desarrollo
#spring.jpa.hibernate.ddl-auto=update

spring.jpa.generate-ddl=true
spring.jpa.defer-datasource-initialization=true 


# ✅ SQL INIT (IMPORTANTE CAMBIO AQUÍ 👇)
#cuando no desarrollo
#spring.sql.init.mode=embedded
#desarrollo
spring.sql.init.mode=always


spring.sql.init.data-locations=classpath:db/data.sql
spring.sql.init.encoding=UTF-8

# ✅ JACKSON
spring.jackson.serialization.fail-on-empty-beans=false

# ✅ VISTAS JSP
spring.mvc.view.prefix=/WEB-INF/view/
spring.mvc.view.suffix=.jsp

# ✅ SERVER
server.error.path=/error
server.port=8081
server.error.whitelabel.enabled=false

# ✅ STATIC
spring.web.resources.add-mappings=true
spring.web.resources.static-locations=classpath:/static/

# ✅ DEVTOOLS (ajustado a nueva ruta)
spring.devtools.restart.exclude=./data/demodb.mv.db,./data/demodb.trace.db;

spring.main.allow-bean-definition-overriding=true

# ✅ LOGGING
logging.level.root=INFO
logging.level.org.springframework=DEBUG
logging.file.name=app.log
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.boot.autoconfigure.web=DEBUG

